services:
  proxy:
    build: .
    image: local/commandcode-proxy:console
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANAGEMENT_PORT:-3050}:3050"
      - "127.0.0.1:${INFERENCE_PORT:-3051}:3051"
    environment:
      HOST: "0.0.0.0"
      PORT: "3050"
      INFERENCE_PORT: "3051"
      CC_DATABASE: "/data/commandcode.sqlite"
      CC_MASTER_KEY_FILE: "/run/secrets/master-key"
      CC_ADMIN_PASSWORD_FILE: "/run/secrets/admin-password"
      CC_ORIGIN: "https://sub.sunmmyapi.xyz"
      CC_API_BASE: "https://api.commandcode.ai"
      CC_MAX_BODY_MB: "8"
      CC_MAX_INFLIGHT: "4"
    volumes:
      - commandcode-data:/data
      - ${CC_SECRETS_DIR:-./secrets}/master-key:/run/secrets/master-key:ro
      - ${CC_SECRETS_DIR:-./secrets}/admin-password:/run/secrets/admin-password:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 8s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  commandcode-data:
    name: commandcode-proxy-data
